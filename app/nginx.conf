# Events 
events {}

#HTTP configuration
http {
    include mime.types;

    upstream api_backend {
        server 139.162.128.109:8080;
    }


    server {
        root /usr/share/nginx/html;
        index index.html;
        server_name thekulture.co.ke www.thekulture.co.ke;
        error_log /var/log/nginx/error_log;
        access_log /var/log/nginx/access_log; 
        listen 443 ssl;
        client_max_body_size 20m;
        ssl_certificate /etc/letsencrypt/live/thekulture.co.ke/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/thekulture.co.ke/privkey.pem;

        location ~* \.mjs$ {
            types {
                application/javascript mjs;
            }
            try_files $uri =404;
        }

        location ~* \.mjs\.map$ {
            types {
                application/json map;
            }
            try_files $uri =404;
        }
 
        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /api/vehicles/location-events {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header X-Accel-Buffering no;
        }

        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    }

    server {
        server_name thekulture.co.ke www.thekulture.co.ke;
        error_log /var/log/nginx/error_log;
        access_log /var/log/nginx/access_log; 
        listen 80;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        return 301 https://thekulture.co.ke$request_uri;
    }

}
