databaseChangeLog:
  - changeSet:
      id: 004-nganya-management-fields
      author: codex
      changes:
        - addColumn:
            tableName: vehicles
            columns:
              - column:
                  name: listing_state
                  type: varchar(30)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: sound_system
                  type: varchar(160)
                  defaultValue: Not specified
                  constraints:
                    nullable: false
              - column:
                  name: custom_features
                  type: varchar(500)
                  defaultValue: ''
                  constraints:
                    nullable: false
