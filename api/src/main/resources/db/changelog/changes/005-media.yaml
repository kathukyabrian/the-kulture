databaseChangeLog:
  - changeSet:
      id: 005-create-media
      author: codex
      changes:
        - createTable:
            tableName: media
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: vehicle_id, type: uuid, constraints: { nullable: false } }
              - column: { name: original_name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: content_type, type: varchar(80), constraints: { nullable: false } }
              - column: { name: size, type: bigint, constraints: { nullable: false } }
              - column: { name: storage_key, type: varchar(500), constraints: { nullable: false, unique: true } }
              - column: { name: sort_order, type: int, constraints: { nullable: false } }
              - column: { name: approved, type: boolean, constraints: { nullable: false } }
              - column: { name: created_at, type: timestamp with time zone, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: media
            baseColumnNames: vehicle_id
            referencedTableName: vehicles
            referencedColumnNames: id
            constraintName: fk_media_vehicle
            onDelete: CASCADE
